appId: com.cryptoalert.app
name: Converter 2 BTC de USD para BRL
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: tab-convert
    timeout: 60000
- tapOn:
    id: tab-convert
- assertVisible: '^Convert Crypto$'
- assertVisible: '^Bitcoin \(BTC\)$'
- assertVisible: '^Enter an amount$'
- tapOn:
    id: conversion-amount
- inputText: '2'
- hideKeyboard
- scrollUntilVisible:
    element:
      text: '^Converted Amount$'
    direction: DOWN
- assertVisible: '^\$[1-9][0-9,]*\.[0-9]{2}$'
- scrollUntilVisible:
    element:
      id: conversion-fiat
    direction: UP
- tapOn:
    id: conversion-fiat
- tapOn:
    id: conversion-fiat-option-BRL
- assertVisible: '^BRL \(R\$\)$'
- scrollUntilVisible:
    element:
      text: '^Converted Amount$'
    direction: DOWN
- assertVisible: '^R\$[1-9][0-9,]*\.[0-9]{2}$'
- assertNotVisible: '^\$[1-9][0-9,]*\.[0-9]{2}$'
