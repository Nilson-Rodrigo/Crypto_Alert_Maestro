appId: com.cryptoalert.app
---
- extendedWaitUntil:
    visible:
      id: tab-alerts
    timeout: 60000
- tapOn:
    id: tab-alerts
- assertVisible: '^Price Alerts$'
- assertVisible: '^No alerts yet$'
- tapOn: '^New Alert$'
- assertVisible: '^Create Alert$'
- tapOn:
    id: alert-cryptocurrency
- tapOn:
    id: alert-cryptocurrency-option-bitcoin
- assertVisible: '^Bitcoin$'
- tapOn:
    id: alert-target-price
